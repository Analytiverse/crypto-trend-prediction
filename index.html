<script>
let dashboardData = null;

const money = (value) => value === null || value === undefined
  ? "-"
  : new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 4
    }).format(value);

const number = (value) => value === null || value === undefined
  ? "-"
  : new Intl.NumberFormat("en-US", {
      maximumFractionDigits: 2
    }).format(value);

const compact = (value) => value === null || value === undefined
  ? "-"
  : new Intl.NumberFormat("en-US", {
      notation: "compact",
      maximumFractionDigits: 2
    }).format(value);


function formatValue(key, value) {

  if (value === null || value === undefined) {
    return "-";
  }

  if (
    ["timestamp", "created_at", "updated_at", "fetched_at"]
      .some(part => key.includes(part))
  ) {

    const date = new Date(value);

    if (!isNaN(date)) {
      return date.toLocaleString();
    }
  }

  if (key.includes("price")) {
    return money(value);
  }

  if (
    key.includes("market_cap") ||
    key.includes("volume") ||
    key.includes("supply")
  ) {
    return number(value);
  }

  return value;
}


function renderCards(rows) {

  const container = document.getElementById("coinCards");

  container.innerHTML = rows.map(coin => `
    <article class="coin-card">

      <div class="coin-top">

        <div class="coin-name">
          ${coin.name}
        </div>

        <div class="symbol">
          ${String(coin.symbol).toUpperCase()}
        </div>

      </div>

      <div class="coin-price">
        ${money(coin.price)}
      </div>

      <div class="metric">
        Market Cap:
        ${compact(coin.market_cap)}
      </div>

      <div class="metric">
        Volume:
        ${compact(coin.total_volume)}
      </div>

      <div class="metric">
        Latest observation:
        ${new Date(coin.timestamp).toLocaleString()}
      </div>

    </article>
  `).join("");
}


function renderTable(definition) {

  const container =
    document.getElementById("tableContainer");

  const rows =
    definition.rows || [];


  if (!rows.length) {

    container.innerHTML = `
      <div class="panel">

        <div class="panel-head">

          <div>
            <h3>${definition.title}</h3>
            <p>${definition.subtitle}</p>
          </div>

          <span class="badge ${definition.type}">
            ${definition.type.toUpperCase()}
          </span>

        </div>

        <div class="empty">
          No rows available.
        </div>

      </div>
    `;

    return;
  }


  const columns =
    Object.keys(rows[0]);


  const header =
    columns
      .map(
        col =>
          `<th>${col.replaceAll("_", " ")}</th>`
      )
      .join("");


  const body =
    rows
      .map(
        row => `
          <tr>
            ${
              columns
                .map(
                  col =>
                    `<td>${formatValue(col, row[col])}</td>`
                )
                .join("")
            }
          </tr>
        `
      )
      .join("");


  container.innerHTML = `

    <div class="panel">

      <div class="panel-head">

        <div>

          <h3>
            ${definition.title}
          </h3>

          <p>
            ${definition.subtitle}
            • Showing ${rows.length} rows
          </p>

        </div>

        <span class="badge ${definition.type}">
          ${definition.type.toUpperCase()}
        </span>

      </div>


      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              ${header}
            </tr>
          </thead>

          <tbody>
            ${body}
          </tbody>

        </table>

      </div>

    </div>
  `;
}


function getTables() {

  return {

    rawCoins: {

      title:
        "Coins",

      subtitle:
        "Tracked coins used for CoinGecko ingestion",

      rows:
        dashboardData.raw.coins,

      type:
        "raw"
    },


    rawMarket: {

      title:
        "Raw Market Data",

      subtitle:
        "Market snapshot records fetched from CoinGecko before cleaning",

      rows:
        dashboardData.raw.market_snapshots,

      type:
        "raw"
    },


    rawHistory: {

      title:
        "Raw Historical Market Data",

      subtitle:
        "Historical price, market cap and volume observations before cleaning",

      rows:
        dashboardData.raw.market_history,

      type:
        "raw"
    },


    cleanMarket: {

      title:
        "Cleaned Market Data",

      subtitle:
        "Market data after null removal and duplicate handling",

      rows:
        dashboardData.cleaned.market_snapshots,

      type:
        "clean"
    },


    cleanHistory: {

      title:
        "Cleaned Historical Data",

      subtitle:
        "Normalized hourly historical data after null and duplicate validation",

      rows:
        dashboardData.cleaned.market_history,

      type:
        "clean"
    },


    merged: {

      title:
        "Merged Market Table",

      subtitle:
        "Final model-ready dataset containing coin, timestamp, price, market cap and volume",

      rows:
        dashboardData.merged,

      type:
        "merged"
    }

  };
}


function showTable(name) {

  if (!dashboardData) {
    return;
  }


  document
    .querySelectorAll(".nav-button")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.table === name
      );

    });


  const tables =
    getTables();


  if (!tables[name]) {

    console.error(
      `Unknown table: ${name}`
    );

    return;
  }


  renderTable(
    tables[name]
  );
}


document
  .querySelectorAll(".nav-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        showTable(
          button.dataset.table
        );

      }
    );

  });


async function loadDashboard() {

  const status =
    document.getElementById("status");


  try {

    status.innerHTML =
      `<span>Loading database data...</span>`;


    const response =
      await fetch("/api/market-data");


    if (!response.ok) {

      throw new Error(
        `API returned ${response.status}`
      );

    }


    dashboardData =
      await response.json();


    console.log(
      "Dashboard API response:",
      dashboardData
    );


    /*
    ------------------------------------------------
    COIN CARDS
    ------------------------------------------------
    */

    renderCards(
      dashboardData.latest || []
    );


    /*
    ------------------------------------------------
    DATA COUNTS
    ------------------------------------------------
    */

    document
      .getElementById("coinCount")
      .textContent =
        number(
          dashboardData.counts.coins
        );


    document
      .getElementById("rawCount")
      .textContent =
        number(
          dashboardData.counts.raw_history
        );


    document
      .getElementById("cleanCount")
      .textContent =
        number(
          dashboardData.counts.clean_history
        );


    document
      .getElementById("snapshotCount")
      .textContent =
        number(
          dashboardData.counts.snapshots
        );


    /*
    ------------------------------------------------
    DATA QUALITY
    ------------------------------------------------
    */

    const quality =
      dashboardData.quality || {};


    document
      .getElementById("rawHistoryNulls")
      .textContent =
        number(
          quality.raw_history_null_rows || 0
        );


    document
      .getElementById("rawHistoryDuplicates")
      .textContent =
        number(
          quality.raw_history_duplicate_rows || 0
        );


    document
      .getElementById("cleanHistoryNulls")
      .textContent =
        number(
          quality.clean_history_null_rows || 0
        );


    document
      .getElementById("cleanHistoryDuplicates")
      .textContent =
        number(
          quality.clean_history_duplicate_rows || 0
        );


    /*
    ------------------------------------------------
    DATABASE STATUS
    ------------------------------------------------
    */

    const latestDates =
      (dashboardData.latest || [])
        .map(
          row =>
            new Date(row.timestamp)
        )
        .filter(
          date =>
            !isNaN(date)
        );


    const latest =
      latestDates
        .sort(
          (a, b) =>
            b - a
        )[0];


    if (latest) {

      status.innerHTML = `

        <span class="status-success">
          ● Database connected
        </span>

        <span>
          Latest market observation:
          ${latest.toLocaleString()}
        </span>
      `;

    } else {

      status.innerHTML = `

        <span class="status-success">
          ● Database connected
        </span>

        <span>
          No latest market observation available
        </span>
      `;
    }


    /*
    ------------------------------------------------
    DEFAULT TABLE
    ------------------------------------------------
    */

    showTable(
      "rawCoins"
    );

  }

  catch (error) {

    console.error(
      "Dashboard load error:",
      error
    );


    status.innerHTML = `

      <span class="status-error">

        Database connection failed:
        ${error.message}

      </span>
    `;
  }
}


loadDashboard();
</script>
