<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Crypto Trend Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        h1 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .status {
            margin-bottom: 25px;
            padding: 12px 16px;
            background: white;
            border-radius: 8px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .coin-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .symbol {
            color: #6b7280;
            font-size: 13px;
        }

        .price {
            font-size: 22px;
            margin: 10px 0;
        }

        .metric {
            font-size: 13px;
            margin-top: 5px;
            color: #4b5563;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        th {
            font-size: 13px;
            color: #6b7280;
        }

        td {
            font-size: 14px;
        }

        .error {
            color: #b91c1c;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Crypto Trend Dashboard</h1>

    <div class="subtitle">
        Live market data stored in PostgreSQL
    </div>

    <div
        class="status"
        id="status"
    >
        Loading database data...
    </div>

    <div
        class="cards"
        id="coinCards"
    ></div>

    <div class="section">

        <h2>Recent Hourly Market Data</h2>

        <table>
            <thead>
                <tr>
                    <th>Coin</th>
                    <th>Timestamp</th>
                    <th>Price</th>
                    <th>Market Cap</th>
                    <th>Volume</th>
                </tr>
            </thead>

            <tbody id="recentTable"></tbody>
        </table>

    </div>

</div>

<script>

function money(value) {
    if (value === null || value === undefined) {
        return "-";
    }

    return new Intl.NumberFormat(
        "en-US",
        {
            style: "currency",
            currency: "USD",
            maximumFractionDigits: 2
        }
    ).format(value);
}


function compactNumber(value) {
    if (value === null || value === undefined) {
        return "-";
    }

    return new Intl.NumberFormat(
        "en-US",
        {
            notation: "compact",
            maximumFractionDigits: 2
        }
    ).format(value);
}


async function loadDashboard() {

    const status = document.getElementById("status");

    try {

        const response = await fetch("/api/market-data");

        if (!response.ok) {
            throw new Error(
                `API returned ${response.status}`
            );
        }

        const data = await response.json();

        const cards =
            document.getElementById("coinCards");

        cards.innerHTML = "";

        data.latest.forEach(coin => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <div class="coin-name">
                    ${coin.name}
                    <span class="symbol">
                        ${coin.symbol.toUpperCase()}
                    </span>
                </div>

                <div class="price">
                    ${money(coin.price)}
                </div>

                <div class="metric">
                    Market Cap:
                    ${compactNumber(coin.market_cap)}
                </div>

                <div class="metric">
                    Volume:
                    ${compactNumber(coin.total_volume)}
                </div>

                <div class="metric">
                    Updated:
                    ${new Date(
                        coin.timestamp
                    ).toLocaleString()}
                </div>
            `;

            cards.appendChild(card);
        });


        const table =
            document.getElementById("recentTable");

        table.innerHTML = "";

        data.recent.forEach(row => {

            const tr =
                document.createElement("tr");

            tr.innerHTML = `
                <td>
                    ${row.name}
                    (${row.symbol.toUpperCase()})
                </td>

                <td>
                    ${new Date(
                        row.timestamp
                    ).toLocaleString()}
                </td>

                <td>
                    ${money(row.price)}
                </td>

                <td>
                    ${compactNumber(row.market_cap)}
                </td>

                <td>
                    ${compactNumber(row.total_volume)}
                </td>
            `;

            table.appendChild(tr);
        });


        if (data.latest.length > 0) {

            const latestTimestamp =
                data.latest
                    .map(row => new Date(row.timestamp))
                    .sort((a, b) => b - a)[0];

            status.textContent =
                `Database connected | Latest data: ${
                    latestTimestamp.toLocaleString()
                }`;
        }
        else {
            status.textContent =
                "Database connected, but no market data was found.";
        }

    }
    catch (error) {

        status.textContent =
            `Failed to load dashboard: ${error.message}`;

        status.className =
            "status error";
    }
}


loadDashboard();

</script>

</body>
</html>
