<script>
let dashboardData = null;


/* =========================
   HELPER FUNCTIONS
========================= */

function getElement(id) {
    return document.getElementById(id);
}

function setText(id, value) {
    const element = getElement(id);

    if (element) {
        element.textContent = value;
    }
}

function money(value) {
    if (value === null || value === undefined) {
        return "-";
    }

    return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 4
    }).format(Number(value));
}

function number(value) {
    if (value === null || value === undefined) {
        return "-";
    }

    return new Intl.NumberFormat("en-US", {
        maximumFractionDigits: 2
    }).format(Number(value));
}

function compact(value) {
    if (value === null || value === undefined) {
        return "-";
    }

    return new Intl.NumberFormat("en-US", {
        notation: "compact",
        maximumFractionDigits: 2
    }).format(Number(value));
}

function formatDate(value) {
    if (!value) {
        return "-";
    }

    const date = new Date(value);

    if (isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString();
}

function formatValue(key, value) {

    if (value === null || value === undefined) {
        return "-";
    }

    const lowerKey = key.toLowerCase();

    if (
        lowerKey.includes("timestamp") ||
        lowerKey.includes("created_at") ||
        lowerKey.includes("updated_at") ||
        lowerKey.includes("fetched_at")
    ) {
        return formatDate(value);
    }

    if (lowerKey.includes("price")) {
        return money(value);
    }

    if (
        lowerKey.includes("market_cap") ||
        lowerKey.includes("volume") ||
        lowerKey.includes("supply")
    ) {
        return number(value);
    }

    return value;
}


/* =========================
   COIN CARDS
========================= */

function renderCards(rows) {

    const container = getElement("coinCards");

    if (!container) {
        console.warn("coinCards element not found");
        return;
    }

    if (!Array.isArray(rows) || rows.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No latest coin data available.
            </div>
        `;

        return;
    }

    container.innerHTML = rows.map(coin => `

        <article class="coin-card">

            <div class="coin-top">

                <div class="coin-name">
                    ${coin.name || coin.coin_id || "-"}
                </div>

                <div class="symbol">
                    ${
                        coin.symbol
                            ? String(coin.symbol).toUpperCase()
                            : "-"
                    }
                </div>

            </div>


            <div class="coin-price">
                ${money(coin.price)}
            </div>


            <div class="metric">
                Market Cap:
                ${compact(coin.market_cap)}
            </div>


            <div class="metric">
                Volume:
                ${compact(coin.total_volume)}
            </div>


            <div class="metric">
                Latest observation:
                ${formatDate(coin.timestamp)}
            </div>

        </article>

    `).join("");
}


/* =========================
   TABLE
========================= */

function renderTable(definition) {

    const container = getElement("tableContainer");

    if (!container) {
        console.error("tableContainer element not found");
        return;
    }

    if (!definition) {

        container.innerHTML = `
            <div class="empty">
                Table configuration not found.
            </div>
        `;

        return;
    }


    const rows = Array.isArray(definition.rows)
        ? definition.rows
        : [];


    if (rows.length === 0) {

        container.innerHTML = `

            <div class="panel">

                <div class="panel-head">

                    <div>

                        <h3>
                            ${definition.title}
                        </h3>

                        <p>
                            ${definition.subtitle}
                        </p>

                    </div>

                    <span class="badge ${definition.type}">
                        ${definition.type.toUpperCase()}
                    </span>

                </div>

                <div class="empty">
                    No rows available for this table.
                </div>

            </div>
        `;

        return;
    }


    const columns = Object.keys(rows[0]);


    const header = columns.map(column => `

        <th>
            ${column.replaceAll("_", " ")}
        </th>

    `).join("");


    const body = rows.map(row => `

        <tr>

            ${columns.map(column => `

                <td>
                    ${formatValue(column, row[column])}
                </td>

            `).join("")}

        </tr>

    `).join("");


    container.innerHTML = `

        <div class="panel">

            <div class="panel-head">

                <div>

                    <h3>
                        ${definition.title}
                    </h3>

                    <p>
                        ${definition.subtitle}
                        • Showing ${rows.length} rows
                    </p>

                </div>


                <span class="badge ${definition.type}">
                    ${definition.type.toUpperCase()}
                </span>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            ${header}
                        </tr>

                    </thead>


                    <tbody>
                        ${body}
                    </tbody>

                </table>

            </div>

        </div>
    `;
}


/* =========================
   TABLE DEFINITIONS
========================= */

function getTables() {

    return {

        rawCoins: {

            title: "Coins",

            subtitle:
                "Coins configured for CoinGecko ingestion",

            rows:
                dashboardData?.raw?.coins || [],

            type:
                "raw"
        },


        rawMarket: {

            title:
                "Raw Market Data",

            subtitle:
                "Market snapshot data fetched from CoinGecko before cleaning",

            rows:
                dashboardData?.raw?.market_snapshots || [],

            type:
                "raw"
        },


        rawHistory: {

            title:
                "Raw Historical Data",

            subtitle:
                "Historical price, market cap and volume before cleaning",

            rows:
                dashboardData?.raw?.market_history || [],

            type:
                "raw"
        },


        cleanMarket: {

            title:
                "Cleaned Market Data",

            subtitle:
                "Market snapshot data after removing null and invalid records",

            rows:
                dashboardData?.cleaned?.market_snapshots || [],

            type:
                "clean"
        },


        cleanHistory: {

            title:
                "Cleaned Historical Data",

            subtitle:
                "Hourly historical data after cleaning, normalization and duplicate removal",

            rows:
                dashboardData?.cleaned?.market_history || [],

            type:
                "clean"
        },


        merged: {

            title:
                "Merged Market Dataset",

            subtitle:
                "Final dataset containing coin, timestamp, price, market cap and volume",

            rows:
                dashboardData?.merged || [],

            type:
                "merged"
        }
    };
}


/* =========================
   SWITCH TABLE
========================= */

function showTable(name) {

    if (!dashboardData) {
        console.warn("Dashboard data has not loaded yet");
        return;
    }


    document
        .querySelectorAll(".nav-button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.table === name
            );

        });


    const tables = getTables();

    const selectedTable = tables[name];


    if (!selectedTable) {

        console.error(
            "Table does not exist:",
            name
        );

        return;
    }


    renderTable(selectedTable);
}


/* =========================
   NAVIGATION
========================= */

document
    .querySelectorAll(".nav-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            function () {

                const tableName =
                    this.dataset.table;

                showTable(tableName);

            }
        );

    });


/* =========================
   LOAD DATA FROM API
========================= */

async function loadDashboard() {

    const status = getElement("status");


    try {

        if (status) {

            status.innerHTML = `
                <span>
                    Loading PostgreSQL data...
                </span>
            `;
        }


        console.log(
            "Calling /api/market-data..."
        );


        const response =
            await fetch(
                "/api/market-data",
                {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );


        console.log(
            "API HTTP status:",
            response.status
        );


        const responseText =
            await response.text();


        console.log(
            "Raw API response:",
            responseText
        );


        if (!response.ok) {

            throw new Error(
                `API returned ${response.status}: ${responseText}`
            );
        }


        try {

            dashboardData =
                JSON.parse(responseText);

        } catch (jsonError) {

            throw new Error(
                "API did not return valid JSON"
            );
        }


        console.log(
            "Dashboard data:",
            dashboardData
        );


        /* =========================
           LATEST COIN CARDS
        ========================= */

        renderCards(
            dashboardData.latest || []
        );


        /* =========================
           COUNTS
        ========================= */

        const counts =
            dashboardData.counts || {};


        setText(
            "coinCount",
            number(
                counts.coins || 0
            )
        );


        setText(
            "rawCount",
            number(
                counts.raw_history || 0
            )
        );


        setText(
            "cleanCount",
            number(
                counts.clean_history || 0
            )
        );


        setText(
            "snapshotCount",
            number(
                counts.snapshots || 0
            )
        );


        /* =========================
           QUALITY
        ========================= */

        const quality =
            dashboardData.quality || {};


        setText(
            "rawHistoryNulls",
            number(
                quality.raw_history_null_rows || 0
            )
        );


        setText(
            "rawHistoryDuplicates",
            number(
                quality.raw_history_duplicate_rows || 0
            )
        );


        setText(
            "cleanHistoryNulls",
            number(
                quality.clean_history_null_rows || 0
            )
        );


        setText(
            "cleanHistoryDuplicates",
            number(
                quality.clean_history_duplicate_rows || 0
            )
        );


        /* =========================
           CONNECTION STATUS
        ========================= */

        const latestRows =
            dashboardData.latest || [];


        const validDates =
            latestRows
                .map(row => new Date(row.timestamp))
                .filter(
                    date =>
                        !isNaN(date.getTime())
                );


        validDates.sort(
            (a, b) => b - a
        );


        const latestDate =
            validDates.length
                ? validDates[0]
                : null;


        if (status) {

            if (latestDate) {

                status.innerHTML = `

                    <span class="status-success">
                        ● Database connected
                    </span>

                    <span>
                        Latest observation:
                        ${latestDate.toLocaleString()}
                    </span>
                `;

            } else {

                status.innerHTML = `

                    <span class="status-success">
                        ● Database connected
                    </span>

                    <span>
                        Data loaded successfully
                    </span>
                `;
            }
        }


        /* =========================
           DEFAULT TABLE
        ========================= */

        showTable(
            "rawCoins"
        );

    }

    catch (error) {

        console.error(
            "Dashboard loading failed:",
            error
        );


        if (status) {

            status.innerHTML = `

                <span class="status-error">

                    Failed to load data:
                    ${error.message}

                </span>
            `;
        }


        const container =
            getElement("tableContainer");


        if (container) {

            container.innerHTML = `

                <div class="panel">

                    <h3>
                        Unable to load dashboard data
                    </h3>

                    <p>
                        ${error.message}
                    </p>

                    <p>
                        Open this URL directly to check the API:
                    </p>

                    <code>
                        /api/market-data
                    </code>

                </div>
            `;
        }
    }
}


/* =========================
   START APPLICATION
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "Dashboard frontend started"
        );

        loadDashboard();

    }
);
</script>
